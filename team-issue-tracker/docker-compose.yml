version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=super_secret_docker_key
      - ENABLE_DEV_TOOLS=true
      - DATABASE_PATH=/app/data/database.sqlite
    volumes:
      # Mount the database directory so SQLite persists between container restarts
      - sqlite_data:/app/data
    restart: unless-stopped

volumes:
  sqlite_data:
